# yaml-language-server: $schema=/epics/ibek-defs/ioc.schema.json

ioc_name: "{{  _global.get_env('IOC_NAME') }}"

description: auto-generated by https://github.com/epics-containers/builder2ibek

entities:
  - type: epics.EpicsEnvSet
    name: EPICS_TS_MIN_WEST
    value: "0"

  - type: epics.EpicsCaMaxArrayBytes
    max_bytes: 100000000

  - type: devIocStats.iocAdminSoft
    IOC: "{{ ioc_name | upper }}"

  - type: autosave.Autosave
    P: "{{ ioc_name | upper }}:"

  - type: ADAravis.aravisCamera
    BUFFERS: 200
    CLASS: AutoADGenICam
    ID: 127.0.0.1
    P: BL01T-DI-CAM-01
    PORT: DCAM1.cam
    R: ":CAM:"

  - type: ADAravis.aravisSettings
    camera: DCAM1.cam

  - type: ADCore.NDROI
    ADDR: 0
    NDARRAY_ADDR: 0
    NDARRAY_PORT: DCAM1.cam
    P: BL01T-DI-CAM-01
    PORT: DCAM1.roi
    QUEUE: 16
    R: ":ROI:"
    TIMEOUT: 1

  - type: ADCore.NDStats
    ADDR: 0
    HIST_SIZE: 65535
    NCHANS: 20000
    NDARRAY_ADDR: 0
    NDARRAY_PORT: DCAM1.cam
    P: BL01T-DI-CAM-01
    PORT: DCAM1.stat
    QUEUE: 16
    R: ":STAT:"
    TIMEOUT: 1
    XSIZE: 1292
    YSIZE: 964

  - type: ADCore.NDStdArrays
    ADDR: 0
    FTVL: UCHAR
    NDARRAY_ADDR: 0
    NDARRAY_PORT: DCAM1.roi
    NELEMENTS: 1245488
    P: BL01T-DI-CAM-01
    PORT: DCAM1.arr
    QUEUE: 2
    R: ":ARR:"
    TIMEOUT: 1
    TYPE: Int8

  - type: ADCore.NDProcess
    ADDR: 0
    NDARRAY_ADDR: 0
    NDARRAY_PORT: DCAM1.cam
    P: BL01T-DI-CAM-01
    PORT: DCAM1.proc
    QUEUE: 16
    R: ":PROC:"
    TIMEOUT: 1

  - type: ADCore.NDOverlay
    ADDR: 0
    NDARRAY_ADDR: 0
    NDARRAY_PORT: DCAM1.proc
    P: BL01T-DI-CAM-01
    PORT: DCAM1.over
    QUEUE: 16
    R: ":OVER:"
    TIMEOUT: 1

  - type: ADCore.NDFileTIFF
    ADDR: 0
    NDARRAY_ADDR: 0
    NDARRAY_PORT: DCAM1.cam
    P: BL01T-DI-CAM-01
    PORT: DCAM1.tiff
    QUEUE: 16
    R: ":TIFF:"
    TIMEOUT: 1

  - type: ADCore.NDFileHDF5
    ADDR: 0
    NDARRAY_ADDR: 0
    NDARRAY_PORT: DCAM1.cam
    P: BL01T-DI-CAM-01
    PORT: DCAM1.hdf
    QUEUE: 16
    R: ":HDF5:"
    TIMEOUT: 1

  - type: ADCore.NDColorConvert
    ADDR: 0
    NDARRAY_ADDR: 0
    NDARRAY_PORT: DCAM1.cam
    P: BL01T-DI-CAM-01
    PORT: DCAM1.cc
    QUEUE: 4
    R: ":CC:"
    TIMEOUT: 1

  - type: ADCore.NDTransform
    ADDR: 0
    NDARRAY_ADDR: 0
    NDARRAY_PORT: DCAM1.cam
    P: BL01T-DI-CAM-01
    PORT: DCAM1.trans
    R: ":TRANS:"
    TIMEOUT: 1

  - type: ffmpegServer.ffmpegStream
    NDARRAY_ADDR: 0
    NDARRAY_PORT: DCAM1.cam
    P: BL01T-DI-CAM-01
    PORT: DCAM1.mjpg
    R: ":MJPG:"

  # Initial settings

  - type: epics.StartupCommand
    command: dbLoadRecords("/epics/ioc/config/devsta.db")

  - type: epics.PostStartupCommand
    command: callbackSetQueueSize(100000)

  - type: epics.PostStartupCommand
    command: dbpf BL01T-DI-CAM-01:CAM:GC_GevSCPSPacketSize 1500

  - type: epics.PostStartupCommand
    command: dbpf BL01T-DI-CAM-01:CAM:GC_StrBytesPerSecond 55000000

  # MJPG

  - type: epics.PostStartupCommand
    command: dbpf BL01T-DI-CAM-01:MJPG:NDArrayPort DCAM1.cam

  - type: epics.PostStartupCommand
    command: dbpf BL01T-DI-CAM-01:MJPG:EnableCallbacks Enable

  - type: epics.PostStartupCommand
    command: dbpf BL01T-DI-CAM-01:MJPG:MAXW 1456

  - type: epics.PostStartupCommand
    command: dbpf BL01T-DI-CAM-01:MJPG:MAXH 1088

  # CAM

  - type: epics.PostStartupCommand
    command: dbpf BL01T-DI-CAM-01:CAM:Acquire 1

  # Final setup

  - type: epics.PostStartupCommand
    command: epicsThreadSleep(1.0)
