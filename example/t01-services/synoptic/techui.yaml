# create_gui example for Phoebus GuiBuilder
beamline:
  location: bl01t
  domain: t01
  desc: Test Beamline
  url: t01-opis.diamond.ac.uk

components:
  fshtr:
    label: Fast Shutter
    prefix: BL01T-EA-FSHTR-01
    status:
      - BL01T-EA-FSHTR-01:FSHTR1.STAT

  diode1:
    label: Diode 1
    prefix: BL01T-DI-PHDGN-01
    file: test.bob

  dcam1:
    label: Diagnostic Camera 1
    prefix: BL01T-DI-CAM-01
    status:
      - BL01T-DI-CAM-01:CAM:DetectorState_RBV

  temp1:
    label: Temperaure Controller 1
    prefix: BL01T-EA-TEMP-01

  motor1:
    label: Motor Stage
    prefix: BL01T-MO-MOTOR-01
    extras:
      - BL01T-MO-BRICK-01
    child_labels:
      X: X1
      Y: Y1
      Z: Z1
